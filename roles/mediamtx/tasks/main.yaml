---
- name: Create MediaMTX project directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ mediamtx_project_dir }}"
    - "{{ mediamtx_container_data_dir }}"

- name: Install SELinux management packages
  ansible.builtin.package:
    name:
      - policycoreutils-python-utils
      - selinux-policy-devel
    state: present
  when: ansible_selinux.status == 'enabled'

- name: Set SELinux file contexts for MediaMTX paths
  community.general.sefcontext:
    target: "{{ mediamtx_project_dir }}(/.*)?"
    setype: container_file_t
    state: present
  when: ansible_selinux.status == 'enabled'
  notify: Restorecon mediamtx

- name: Restore SELinux contexts for MediaMTX paths
  ansible.builtin.command: "restorecon -Rv {{ mediamtx_project_dir }}"
  changed_when: false
  when: ansible_selinux.status == 'enabled'

- name: Deploy MediaMTX configuration
  ansible.builtin.template:
    src: mediamtx.yaml.j2
    dest: "{{ mediamtx_project_dir }}/mediamtx.yml"
    owner: root
    group: root
    mode: '0640'
  notify: Restart mediamtx

- name: Deploy MediaMTX docker-compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ mediamtx_project_dir }}/docker-compose.yaml"
    owner: root
    group: root
    mode: '0644'
  notify: Restart mediamtx

- name: Start MediaMTX container
  community.docker.docker_compose_v2:
    project_src: "{{ mediamtx_project_dir }}"
    state: present
    pull: missing

- name: Configure reverse proxy for MediaMTX
  ansible.builtin.include_role:
    name: reverse_proxy
  vars:
    reverse_proxy_domain: "{{ mediamtx_domain }}"
    reverse_proxy_certbot_email: "{{ mediamtx_certbot_email }}"
    reverse_proxy_site_name: "{{ mediamtx_reverse_proxy_site_name }}"
    reverse_proxy_site_conf: "{{ mediamtx_reverse_proxy_site_name }}.conf"
    reverse_proxy_site_template: mediamtx-site.conf.j2
    reverse_proxy_frontend_upstream: "http://127.0.0.1:8888"
    reverse_proxy_backend_upstream: "http://127.0.0.1:9997"
    reverse_proxy_api_path_prefix: /api/
    reverse_proxy_api_rate_limit: "{{ mediamtx_api_rate_limit }}"
    reverse_proxy_api_rate_burst: "{{ mediamtx_api_rate_burst }}"
    reverse_proxy_api_allowlist:
      - "{{ mediamtx_api_allow_ip }}"
    reverse_proxy_trusted_origins: "{{ mediamtx_hls_trusted_origins }}"

- name: Allow RTMP through firewall
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  loop:
    - 1935
    - 1936

- name: Allow HTTP and HTTPS through firewall
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop:
    - http
    - https

- name: Add MediaMTX and nginx audit rules
  ansible.builtin.blockinfile:
    path: /etc/audit/rules.d/mediamtx.rules
    create: true
    mode: '0640'
    owner: root
    group: root
    block: |
      -w {{ mediamtx_project_dir }}/ -p wa -k mediamtx_config
      -w /etc/nginx/conf.d/{{ mediamtx_reverse_proxy_site_name }}.conf -p wa -k nginx_config
      -w /etc/letsencrypt/live/{{ mediamtx_domain }}/ -p wa -k mediamtx_tls
  notify: Restart auditd
...
