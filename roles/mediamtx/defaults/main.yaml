---
mediamtx_domain: mediamtx.ctrl-alt-gg.hu
mediamtx_project_dir: /opt/mediamtx
mediamtx_container_data_dir: "{{ mediamtx_project_dir }}/data"
mediamtx_compose_image: bluenviron/mediamtx:1
mediamtx_reverse_proxy_site_name: mediamtx
mediamtx_api_rate_limit: 10r/s
mediamtx_api_rate_burst: 20

# TLS certificates are managed outside this role and must exist before deploy.
mediamtx_certbot_email: ""

mediamtx_admin_user: admin
mediamtx_admin_password: SECRET0
mediamtx_streamer_user: streamer
mediamtx_streamer_password: SECRET1
mediamtx_ingest_user: ingest
mediamtx_ingest_password: SECRET2

mediamtx_liveout_path: liveout
mediamtx_ingest_path: secondstreamer
mediamtx_any_publish_regex: "~^live/[A-Za-z0-9_-]+$"

mediamtx_youtube_stream_key: YT_KEY
mediamtx_twitch_stream_key: TW_KEY

mediamtx_api_allow_ip: 192.168.130.16
mediamtx_hls_trusted_origins:
  - http://localhost:8000
  - https://localhost:8000
  - http://127.0.0.1:8000
  - https://127.0.0.1:8000
...
